[project]
name = "tmux-weather"
version = "0.1.0"
description = "tmux plugin that shows the current weather in the status bar"
authors = [
    {name = "Colin Morrell",email = "colin.l.morrell@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[tool.poetry]
# not an installable package: TPM runs scripts/ with the system python3 (stdlib only)
package-mode = false

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[dependency-groups]
dev = [
    "ipython (>=9.17.1,<10.0.0)",
    "rich (>=15.0.0,<16.0.0)"
]
